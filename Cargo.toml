[package]
name = "url_shortener"
version = "0.1.0"
authors = ["X-rays5 <thomas@scheenen.dev>"]
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8"
serde_json = "1.0"
rand = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
